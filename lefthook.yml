pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx,astro}"
      run: pnpm eslint --fix --max-warnings=0 {staged_files} && git add {staged_files}
    typecheck:
      run: pnpm run check
    test:
      glob: "*.{ts,tsx,astro}"
      # No --config: vitest.config.ts is the unit suite. The integration suite needs the local
      # Supabase stack and is deliberately out of the pre-commit path.
      run: pnpm vitest related {staged_files} --run
