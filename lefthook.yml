pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx,astro}"
      # --no-warn-ignored: staged paths are passed to ESLint explicitly, and naming an
      # ESLint-ignored file directly emits a "File ignored because of a matching ignore
      # pattern" *warning* — which --max-warnings=0 promotes to a failed commit. That fires
      # on any commit staging generated sources (e.g. src/lib/database.types.ts, regenerated
      # whenever a migration lands), even though `pnpm lint` is green because the
      # project-wide run never visits ignored files. Real rule violations still fail the gate.
      run: pnpm eslint --fix --max-warnings=0 --no-warn-ignored {staged_files} && git add {staged_files}
    typecheck:
      run: pnpm run check
    test:
      # The whole unit suite, not `vitest related {staged_files}`. `related` resolves staged files
      # through the unit config's module graph, so a commit touching only test/ fixtures, configs or
      # integration tests selected nothing and passed with "No test files found" — a green gate
      # carrying no signal. The suite runs in well under a second; there is nothing to optimise here.
      #
      # No --config: vitest.config.ts is the unit suite. The integration suite needs the local
      # Supabase stack and is deliberately out of the pre-commit path — `pnpm test:integration`
      # covers it, and CI is where it belongs as a blocking gate.
      run: pnpm test
