name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Third-party action in a job that later reads SUPABASE_* secrets, so it is pinned
      # to a commit rather than the mutable `v4` tag. Bump deliberately, not implicitly.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec astro sync
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: TZ=America/New_York pnpm test
      - run: pnpm build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec astro sync
      - run: pnpm exec supabase start
      - name: Materialize local Supabase environment
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            printf 'SUPABASE_URL=%s\n' "$API_URL"
            printf 'SUPABASE_KEY=%s\n' "$ANON_KEY"
            printf 'SUPABASE_DB_URL=%s\n' "$DB_URL"
          } > .env
      - run: pnpm test:integration
      - run: pnpm test:sql
      - run: pnpm test:http
