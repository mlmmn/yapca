name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Third-party action in a job that later reads SUPABASE_* secrets, so it is pinned
      # to a commit rather than the mutable `v4` tag. Bump deliberately, not implicitly.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec astro sync
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: TZ=America/New_York pnpm test
      - run: pnpm build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec astro sync
      - run: pnpm exec supabase start
      - name: Materialize local Supabase environment
        run: |
          set -euo pipefail
          # Capture on its own line: `eval` returns 0 on empty input, so a failed
          # `supabase status` would otherwise write an empty .env and go green.
          status_env="$(pnpm exec supabase status -o env)"
          eval "$status_env"
          for required in API_URL ANON_KEY DB_URL; do
            eval "value=\${$required:-}"
            if [ -z "$value" ]; then
              echo "supabase status did not report $required" >&2
              exit 1
            fi
          done
          {
            printf 'SUPABASE_URL=%s\n' "$API_URL"
            printf 'SUPABASE_KEY=%s\n' "$ANON_KEY"
            printf 'SUPABASE_DB_URL=%s\n' "$DB_URL"
          } > .env
      - run: pnpm test:integration
      - run: pnpm test:sql
      - run: pnpm test:http

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        name: Detect migration changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          else
            base_ref="${{ github.event.before }}"
          fi

          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"

          if git diff --quiet "$base_ref" HEAD -- supabase/migrations; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: no migration changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Migration changes detected relative to $base_ref."
          fi
      - if: steps.detect.outputs.changed == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.detect.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.changed == 'true'
        run: pnpm exec supabase start
      - if: steps.detect.outputs.changed == 'true'
        run: pnpm test:migrations
        env:
          MIGRATION_GATE_BASE_REF: ${{ steps.detect.outputs.base_ref }}
